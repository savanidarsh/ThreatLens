<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ThreatLens">
  <meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>ThreatLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f6f3ec;--card:#fffdf8;--text:#1c1a17;--muted:#6d675d;--faint:#a39c8f;--line:#e2dccf;--rule:#1c1a17;
      --accent:#b8442a;--tint:rgba(184,68,42,.07);--crit:#b3261e;--high:#9a5b00;
      --serif:"Newsreader",Georgia,"Times New Roman",serif;
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#121110;--card:#1a1917;--text:#ece7dc;--muted:#a09a8d;--faint:#6b665c;--line:#2b2926;--rule:#ece7dc;
      --accent:#ee8a6c;--tint:rgba(238,138,108,.09);--crit:#ff7b72;--high:#e9b25a;
    }}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;
      padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
    button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .wrap{max-width:660px;margin:0 auto;padding:24px 20px 72px}
    @media(min-width:640px){.wrap{padding-top:48px}}
    .caps{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase}

    /* Masthead */
    .top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted)}
    .refresh{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;
      font-size:12.5px;color:var(--text);background:var(--card);transition:border-color .15s}
    .refresh:hover{border-color:var(--faint)}
    .refresh:disabled{color:var(--faint);cursor:default}
    .refresh svg{width:13px;height:13px}
    .refresh.spin svg{animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    h1{font-family:var(--serif);font-weight:500;font-size:clamp(44px,13vw,68px);line-height:1;letter-spacing:-1.5px;margin:18px 0 6px}
    h1 em{font-style:italic;color:var(--accent)}
    .tag{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted)}
    .rule{border:0;border-top:2px solid var(--rule);margin-top:20px;position:relative}
    .rule::after{content:'';position:absolute;left:0;right:0;top:3px;border-top:1px solid var(--rule)}

    nav{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:6px}
    .tab{padding:14px 0 12px;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px}
    .tab.on{color:var(--text);border-bottom-color:var(--accent)}
    .tab span{font-weight:500;letter-spacing:.3px;margin-left:5px;color:var(--faint)}

    .status{font-size:12.5px;color:var(--muted);margin:16px 0 12px;min-height:19px}
    .status .err{color:var(--crit)}
    .filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}
    .filters::-webkit-scrollbar{display:none}
    .chip{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap}
    .chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}
    .chip.src{background:var(--tint);border-color:transparent;color:var(--accent)}

    /* Stories */
    .item{padding:24px 0;border-bottom:1px solid var(--line)}
    .kick{display:flex;flex-wrap:wrap;gap:4px 10px;color:var(--muted);margin-bottom:8px}
    .kick .crit{color:var(--crit)}
    .kick .high{color:var(--high)}
    .item h2{font-family:var(--serif);font-weight:500;font-size:21px;line-height:1.28;letter-spacing:-.2px}
    .item.lead h2{font-size:clamp(26px,7vw,32px);line-height:1.18;letter-spacing:-.5px}
    .item h2 a{color:inherit;text-decoration:none;background:linear-gradient(var(--accent),var(--accent)) 0 100%/0 1px no-repeat;transition:background-size .25s}
    .item h2 a:hover{background-size:100% 1px}
    .sum{font-size:14.5px;color:var(--muted);margin-top:8px}
    .by{font-size:12.5px;color:var(--faint);margin-top:10px}
    .by b{font-weight:600;color:var(--muted)}

    .more{display:flex;flex-direction:column;gap:6px;margin-top:14px}
    details{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
    summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;
      font-size:13.5px;font-weight:500;-webkit-tap-highlight-color:transparent}
    summary::-webkit-details-marker{display:none}
    summary::after{content:'+';font-size:17px;line-height:1;color:var(--accent);font-weight:400}
    details[open] summary::after{content:'–'}
    .body{padding:2px 14px 14px;font-size:14px;color:var(--muted)}
    .body ul{list-style:none}
    .body li{position:relative;padding-left:16px;margin:7px 0}
    .body li::before{content:'';position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

    /* Sources */
    .sec{color:var(--muted);margin:26px 0 6px}
    .note{font-size:13.5px;color:var(--muted);margin-top:4px}
    .row{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
    .row .n{font-family:var(--serif);font-size:17px}
    .row .dots{flex:1;border-bottom:1px dotted var(--faint);transform:translateY(-4px);opacity:.6}
    .row .c{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
    button.row:hover .n{color:var(--accent)}
    .quiet{font-size:13.5px;color:var(--muted);line-height:1.9}
    .quiet a{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
    .quiet a:hover{color:var(--accent)}

    .empty{padding:56px 0;text-align:center;font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted)}
    .skel{padding:24px 0;border-bottom:1px solid var(--line)}
    .skel i{display:block;height:11px;border-radius:3px;background:var(--line);margin-bottom:11px;animation:fade 1.4s ease-in-out infinite}
    @keyframes fade{50%{opacity:.4}}
    footer{margin-top:40px;text-align:center;color:var(--faint)}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="caps" id="date"></div>
    <button class="refresh" id="refresh" onclick="load(true)" aria-label="Refresh news">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>Refresh</span>
    </button>
  </div>
  <h1>Threat<em>Lens</em></h1>
  <p class="tag">Security news, explained simply.</p>
  <hr class="rule">

  <nav>
    <button class="tab caps on" id="tab-latest" onclick="go('latest')">Latest</button>
    <button class="tab caps" id="tab-sources" onclick="go('sources')">Sources<span id="srcCount"></span></button>
  </nav>

  <div class="status" id="status"></div>
  <div class="filters" id="filters"></div>
  <main id="list"></main>

  <footer class="caps">ThreatLens</footer>
</div>

<script>
const KEY='tl2_news',TTL=30;
const CATS=[['all','All'],['threats','Threats'],['vulnerabilities','Vulnerabilities'],['breaches','Breaches'],['cloud','Cloud'],['ai','AI'],['policy','Policy']];
const S={view:'latest',items:[],feeds:[],cat:'all',src:null,loading:false,at:null,err:null};
const $=id=>document.getElementById(id);

$('date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// Show the saved copy instantly, then fetch fresh if it is older than 30 minutes
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.items&&d.items.length){S.items=d.items;S.feeds=d.feeds||[];S.at=d.ts}}catch(e){}
render();
if(!S.at||Date.now()-S.at>TTL*60000)load(false);

function go(v){S.view=v;render();scrollTo(0,0)}
function setCat(c){S.cat=c;render()}
function setSrc(i){S.src=i==null?null:counts()[i][0];S.cat='all';S.view='latest';render();scrollTo(0,0)}

async function load(force){
  if(S.loading)return;
  S.loading=true;S.err=null;render();
  try{
    const r=await fetch('/api/news'+(force?'?r='+Date.now():''));
    const d=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((d&&d.error)||'Server error '+r.status);
    if(!d||!d.items||!d.items.length)throw new Error('Nothing came back from the feeds.');
    S.items=d.items;S.feeds=d.feeds||[];S.at=Date.now();
    if(S.src&&!S.items.some(i=>i.source===S.src))S.src=null;
    try{localStorage.setItem(KEY,JSON.stringify({items:S.items,feeds:S.feeds,ts:S.at}))}catch(e){}
  }catch(e){S.err=e.message||'Could not load.'}
  finally{S.loading=false;render()}
}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function link(u){return /^https?:\/\//i.test(u||'')?esc(u):''}
function ago(d){
  const t=new Date(d).getTime();if(!t)return'';
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  if(m<60)return m<1?'just now':m+'m ago';
  const h=Math.round(m/60);return h<24?h+'h ago':Math.round(h/24)+'d ago';
}
// [source name, story count], most stories first
function counts(){
  const m=new Map();
  for(const i of S.items)if(i.source)m.set(i.source,(m.get(i.source)||0)+1);
  return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

function render(){
  const latest=S.view==='latest',cs=counts();
  $('tab-latest').classList.toggle('on',latest);
  $('tab-sources').classList.toggle('on',!latest);
  $('srcCount').textContent=cs.length||'';
  const btn=$('refresh');
  btn.disabled=S.loading;btn.classList.toggle('spin',S.loading);
  btn.lastElementChild.textContent=S.loading?'Refreshing':'Refresh';

  let st='';
  if(S.loading&&!S.items.length)st='Loading the latest stories…';
  else if(S.items.length)st=S.items.length+' stories from '+cs.length+' sources · updated '+new Date(S.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(S.err)st=(st?st+' · ':'')+'<span class="err">'+esc(S.err)+'</span>';
  $('status').innerHTML=st;

  if(!S.items.length){
    $('filters').innerHTML='';
    $('list').innerHTML=S.loading
      ?[70,55,80,60].map(w=>`<div class="skel"><i style="width:28%"></i><i style="width:${w}%;height:16px"></i><i style="width:92%"></i></div>`).join('')
      :`<div class="empty">${S.err?'Couldn’t load right now. Tap Refresh to try again.':'Nothing here yet.'}</div>`;
    return;
  }
  if(latest)renderLatest();else renderSources(cs);
}

function renderLatest(){
  const pool=S.src?S.items.filter(i=>i.source===S.src):S.items;
  const srcChip=S.src?`<button class="chip src" onclick="setSrc(null)" aria-label="Clear source filter">${esc(S.src)} ✕</button>`:'';
  $('filters').innerHTML=srcChip+CATS.filter(([id])=>id==='all'||pool.some(i=>i.category===id))
    .map(([id,name])=>`<button class="chip ${S.cat===id?'on':''}" onclick="setCat('${id}')">${name}</button>`).join('');
  const rows=S.cat==='all'?pool:pool.filter(i=>i.category===S.cat);
  $('list').innerHTML=rows.length?rows.map(story).join(''):'<div class="empty">No stories match this filter.</div>';
}

function story(n,i){
  const u=link(n.url),pri=n.priority;
  const kick=(pri==='critical'||pri==='high'?`<span class="${pri==='critical'?'crit':'high'}">${pri}</span>`:'')+(n.threat_label?`<span>${esc(n.threat_label)}</span>`:'');
  const when=n.pubDate?ago(n.pubDate):'';
  const explain=n.explanation?`<details><summary>What this means</summary><div class="body">${esc(n.explanation)}</div></details>`:'';
  const protect=n.prevention&&n.prevention.length?`<details><summary>How to protect yourself</summary><div class="body"><ul>${n.prevention.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></details>`:'';
  return `<article class="item${i===0?' lead':''}">
    <div class="kick caps">${kick}</div>
    <h2>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title)}</h2>
    ${n.summary?`<p class="sum">${esc(n.summary)}</p>`:''}
    <div class="by"><b>${esc(n.source||'Unknown source')}</b>${when?' · '+when:''}</div>
    <div class="more">${explain}${protect}</div>
  </article>`;
}

function renderSources(cs){
  $('filters').innerHTML='';
  const active=new Set(cs.map(c=>c[0]));
  const quiet=S.feeds.filter(f=>!active.has(f.name)&&f.name!=='Google News');
  const rows=cs.map(([name,c],i)=>`<button class="row" onclick="setSrc(${i})"><span class="n">${esc(name)}</span><span class="dots"></span><span class="c">${c} ${c===1?'story':'stories'}</span></button>`).join('');
  const quietHtml=quiet.length?`<div class="sec caps">Also monitored</div>
    <p class="note">Checked on every refresh, but none of their stories are in the feed right now.</p>
    <p class="quiet" style="margin-top:8px">${quiet.map(f=>{const u=link(f.site);return u?`<a href="${u}" target="_blank" rel="noopener">${esc(f.name)}</a>`:esc(f.name)}).join(' · ')}</p>`:'';
  $('list').innerHTML=`<div class="sec caps" style="margin-top:8px">In today’s feed</div>
    <p class="note">Tap a source to see only its stories. Mainstream outlets are found through Google News.</p>
    <div style="margin-top:6px">${rows}</div>${quietHtml}`;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
