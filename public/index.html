<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ThreatLens">
  <meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0f" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>ThreatLens</title>
  <style>
    :root{
      --bg:#fbfbfa;--text:#161616;--muted:#6b6b6b;--faint:#9a9a9a;--line:#e6e6e3;--hover:#f1f1ee;
      --accent:#1f5eff;--crit:#c62828;--high:#b26a00;--ok:#1b7f4b;
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#0e0e0f;--text:#ececec;--muted:#9b9b9b;--faint:#6a6a6a;--line:#242426;--hover:#19191b;
      --accent:#7da2ff;--crit:#ff6b6b;--high:#f0b045;--ok:#5fd093;
    }}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{-webkit-text-size-adjust:100%}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;
      padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
    .wrap{max-width:680px;margin:0 auto;padding:32px 20px 64px}
    @media(min-width:640px){.wrap{padding-top:56px}}

    header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:28px}
    h1{font-size:22px;font-weight:650;letter-spacing:-0.4px}
    .date{font-size:13px;color:var(--muted);margin-top:2px}
    .refresh{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;background:none;border:1px solid var(--line);border-radius:999px;
      padding:8px 14px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .refresh:hover{background:var(--hover)}
    .refresh:disabled{color:var(--faint);cursor:default}
    .refresh svg{width:14px;height:14px}
    .refresh.spin svg{animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    nav{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:16px}
    .tab{background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;padding:10px 0;font:inherit;font-size:14px;
      color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
    .tab.on{color:var(--text);border-bottom-color:var(--text);font-weight:600}

    .status{font-size:12.5px;color:var(--muted);margin-bottom:12px;min-height:19px}
    .status .err{color:var(--crit)}
    .filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 8px;padding:0 20px 4px}
    .filters::-webkit-scrollbar{display:none}
    .chip{flex-shrink:0;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:12.5px;
      color:var(--muted);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
    .chip.on{background:var(--text);border-color:var(--text);color:var(--bg)}

    .item{padding:20px 0;border-bottom:1px solid var(--line)}
    .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:12px;color:var(--muted);margin-bottom:6px}
    .meta .pri{font-weight:600}
    .pri::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
    .p-critical,.p-deadline_soon{color:var(--crit)}
    .p-high,.p-upcoming{color:var(--high)}
    .p-medium,.p-low,.p-open,.p-future{color:var(--muted)}
    .item h2{font-size:16.5px;font-weight:600;line-height:1.4;letter-spacing:-0.1px}
    .item h2 a{color:inherit;text-decoration:none}
    .item h2 a:hover{text-decoration:underline;text-underline-offset:3px}
    .sum{font-size:14px;color:var(--muted);margin-top:6px}
    .facts{font-size:13px;color:var(--muted);margin-top:8px}
    .facts span+span::before{content:'·';margin:0 8px;color:var(--faint)}

    .more{display:flex;flex-direction:column;margin-top:10px}
    details{font-size:14px}
    summary{list-style:none;cursor:pointer;color:var(--accent);font-size:13.5px;padding:5px 0;width:fit-content;-webkit-tap-highlight-color:transparent}
    summary::-webkit-details-marker{display:none}
    summary::before{content:'+';display:inline-block;width:14px;font-family:var(--mono)}
    details[open] summary::before{content:'−'}
    .body{padding:4px 0 10px 14px;color:var(--text)}
    .body ul{padding-left:18px}
    .body li{margin:5px 0}

    .empty{padding:48px 0;text-align:center;font-size:14px;color:var(--muted)}
    .skel{padding:20px 0;border-bottom:1px solid var(--line)}
    .skel i{display:block;height:10px;border-radius:3px;background:var(--line);margin-bottom:10px;animation:fade 1.4s ease-in-out infinite}
    @keyframes fade{50%{opacity:.4}}
    footer{margin-top:40px;font-size:12px;color:var(--faint);text-align:center}
    :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>ThreatLens</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="refresh" id="refresh" onclick="load(S.tab,true)" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <span>Refresh</span>
    </button>
  </header>

  <nav>
    <button class="tab on" id="tab-news" onclick="go('news')">News</button>
    <button class="tab" id="tab-conf" onclick="go('conf')">Conferences</button>
  </nav>

  <div class="status" id="status"></div>
  <div class="filters" id="filters"></div>
  <main id="list"></main>

  <footer>Security news, explained simply.</footer>
</div>

<script>
const CFG={
  news:{url:'/api/news',key:'tl1_news',ttl:30,field:'category',noun:'stories',
    filters:[['all','All'],['threats','Threats'],['vulnerabilities','Vulnerabilities'],['breaches','Breaches'],['cloud','Cloud'],['ai','AI'],['policy','Policy']]},
  conf:{url:'/api/conferences',key:'tl1_conf',ttl:60,field:'type',noun:'listings',
    filters:[['all','All'],['conference','Events'],['scholarship','Scholarships'],['volunteer','Volunteer'],['student_program','Student programs'],['cfp','Call for papers']]}
};
const S={tab:'news',news:{items:[],filter:'all',loading:false,at:null,err:null},conf:{items:[],filter:'all',loading:false,at:null,err:null}};
const $=id=>document.getElementById(id);

$('date').textContent=new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});

// Show cached data instantly, then fetch fresh if it is stale
for(const t of ['news','conf']){
  try{const d=JSON.parse(localStorage.getItem(CFG[t].key));if(d&&d.items&&d.items.length){S[t].items=d.items;S[t].at=d.ts}}catch(e){}
}
render();
ensure('news');

function stale(t){return !S[t].at||Date.now()-S[t].at>CFG[t].ttl*60000}
function ensure(t){if(stale(t))load(t,false)}
function go(t){S.tab=t;render();ensure(t)}
function setFilter(f){S[S.tab].filter=f;render()}

async function load(t,force){
  const s=S[t],c=CFG[t];
  if(s.loading)return;
  s.loading=true;s.err=null;render();
  try{
    const r=await fetch(c.url+(force?'?r='+Date.now():''));
    const d=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((d&&d.error)||'Server error '+r.status);
    if(!d||!d.items||!d.items.length)throw new Error('Nothing came back from the feeds.');
    s.items=d.items;s.at=Date.now();
    try{localStorage.setItem(c.key,JSON.stringify({items:s.items,ts:s.at}))}catch(e){}
  }catch(e){s.err=e.message||'Could not load.'}
  finally{s.loading=false;render()}
}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function link(u){return /^https?:\/\//i.test(u||'')?esc(u):''}
function label(v){v=String(v||'').replace(/_/g,' ');return v.charAt(0).toUpperCase()+v.slice(1)}
function ago(d){
  const t=new Date(d).getTime();if(!t)return'';
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  if(m<60)return m<1?'just now':m+'m ago';
  const h=Math.round(m/60);return h<24?h+'h ago':Math.round(h/24)+'d ago';
}
function known(v){return v&&!['N/A','TBA','See details'].includes(v)}

function render(){
  const t=S.tab,s=S[t],c=CFG[t];
  $('tab-news').classList.toggle('on',t==='news');
  $('tab-conf').classList.toggle('on',t==='conf');
  const btn=$('refresh');
  btn.disabled=s.loading;btn.classList.toggle('spin',s.loading);
  btn.lastElementChild.textContent=s.loading?'Refreshing':'Refresh';

  // Status line
  let st='';
  if(s.loading&&!s.items.length)st='Loading…';
  else if(s.items.length){
    st=s.items.length+' '+c.noun;
    if(t==='news')st+=' · '+new Set(s.items.map(i=>i.source)).size+' sources';
    st+=' · updated '+new Date(s.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  }
  if(s.err)st=(st?st+' · ':'')+'<span class="err">'+esc(s.err)+'</span>';
  $('status').innerHTML=st;

  // Filters
  $('filters').innerHTML=s.items.length?c.filters
    .filter(([id])=>id==='all'||s.items.some(i=>i[c.field]===id))
    .map(([id,name])=>`<button class="chip ${s.filter===id?'on':''}" onclick="setFilter('${id}')">${name}</button>`).join(''):'';

  // List
  if(!s.items.length){
    $('list').innerHTML=s.loading
      ?[70,55,80,60].map(w=>`<div class="skel"><i style="width:30%"></i><i style="width:${w}%"></i><i style="width:90%"></i></div>`).join('')
      :`<div class="empty">${s.err?'Couldn’t load right now. Tap Refresh to try again.':'Nothing here yet.'}</div>`;
    return;
  }
  const rows=s.filter==='all'?s.items:s.items.filter(i=>i[c.field]===s.filter);
  $('list').innerHTML=rows.map(t==='news'?newsItem:confItem).join('');
}

function heading(n){const u=link(n.url);return `<h2>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(n.title)}</a>`:esc(n.title)}</h2>`}

function newsItem(n){
  const pri=n.priority||'medium';
  const meta=[
    pri==='critical'||pri==='high'?`<span class="pri p-${pri}">${label(pri)}</span>`:'',
    n.threat_label?`<span>${esc(n.threat_label)}</span>`:'',
    n.source?`<span>${esc(n.source)}</span>`:'',
    n.pubDate?`<span>${ago(n.pubDate)}</span>`:''
  ].join('');
  const explain=n.explanation?`<details><summary>What this means</summary><div class="body">${esc(n.explanation)}</div></details>`:'';
  const protect=n.prevention&&n.prevention.length?`<details><summary>How to protect yourself</summary><div class="body"><ul>${n.prevention.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></details>`:'';
  return `<article class="item"><div class="meta">${meta}</div>${heading(n)}${n.summary?`<p class="sum">${esc(n.summary)}</p>`:''}<div class="more">${explain}${protect}</div></article>`;
}

function confItem(n){
  const u=n.urgency||'upcoming';
  const meta=`<span>${label(n.type||'conference')}</span><span class="pri p-${esc(u)}">${label(u)}</span>${n.source?`<span>${esc(n.source)}</span>`:''}`;
  const facts=[
    known(n.deadline)?`<span>Deadline: ${esc(n.deadline)}</span>`:'',
    known(n.location)?`<span>${esc(n.location)}</span>`:'',
    known(n.cost_for_students)?`<span>${esc(n.cost_for_students)}</span>`:''
  ].join('');
  return `<article class="item"><div class="meta">${meta}</div>${heading(n)}${n.summary?`<p class="sum">${esc(n.summary)}</p>`:''}${facts?`<div class="facts">${facts}</div>`:''}</article>`;
}

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
