<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ThreatLens">
  <meta name="theme-color" content="#0c0c0d">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <title>ThreatLens</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0c0c0d;--panel:#18181a;--panel2:#222225;--line:#2c2c30;--text:#f5f5f2;--muted:#8d8d93;--ink:#141414;
      --yellow:#f5f230;--red:#ff3b30;--orange:#ff9545;
      --c0:#fdf0c0;--c1:#fbd8d2;--c2:#d5e6fb;--c3:#e3dbfa;--c4:#d6f1dd;
      --font:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    [hidden]{display:none!important}
    html{-webkit-text-size-adjust:100%;background:var(--bg)}
    body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;
      padding:env(safe-area-inset-top,0) 0 calc(112px + env(safe-area-inset-bottom,0))}
    button,input,textarea{font:inherit;color:inherit;background:none;border:none}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent}
    svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .wrap{max-width:560px;margin:0 auto;padding:20px 16px 0}

    /* Header */
    header{display:flex;align-items:center;gap:10px;margin-bottom:16px}
    .logo{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--ink);display:grid;place-items:center}
    .logo svg{width:19px;height:19px;stroke-width:2.3}
    h1{font-size:23px;font-weight:600;letter-spacing:-.3px;flex:1}
    .round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;transition:background .15s}
    .round:hover{background:var(--panel)}
    .round:disabled{color:var(--muted);cursor:default}
    .round.spin svg{animation:spin .9s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* Tools: search + category tabs */
    .search{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:999px;padding:0 6px 0 18px;height:48px;margin-bottom:12px}
    .search:focus-within{box-shadow:0 0 0 2px var(--yellow)}
    .search input{flex:1;min-width:0;outline:none;font-size:16px}
    .search input::placeholder,.addrow input::placeholder{color:var(--muted)}
    .search span{width:36px;height:36px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
    .search svg{width:17px;height:17px}
    .cats{display:flex;align-items:baseline;gap:22px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px}
    .cats::-webkit-scrollbar{display:none}
    .cat{flex-shrink:0;font-size:15px;font-weight:300;color:var(--muted);white-space:nowrap;padding:4px 0;transition:color .15s}
    .cat.on{font-size:21px;font-weight:500;color:var(--text)}
    .srcpill{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:var(--yellow);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
    .vtitle{font-size:26px;font-weight:600;letter-spacing:-.4px;margin-bottom:6px}
    .status{font-size:13px;font-weight:300;color:var(--muted);margin-bottom:14px;min-height:20px}
    .status .err{color:var(--red)}

    /* Story cards */
    .cards{display:grid;gap:14px}
    .card{border-radius:28px;padding:22px 20px 16px;color:var(--ink);background:var(--c0);animation:rise .4s ease-out both}
    .c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    .badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .b{font-size:10.5px;font-weight:600;letter-spacing:.7px;text-transform:uppercase;padding:4px 9px;border-radius:7px;background:rgba(0,0,0,.08)}
    .b.crit{background:var(--red);color:#fff}
    .b.high{background:var(--ink);color:#fff}
    .b.you{background:var(--ink);color:var(--yellow)}
    .card h2{font-size:22px;font-weight:600;line-height:1.28;letter-spacing:-.3px}
    .upd{font-size:12px;font-weight:300;opacity:.65;margin-top:8px}
    .pub{display:flex;align-items:center;gap:10px;margin-top:14px}
    .av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:600;flex-shrink:0}
    .pub div{flex:1;min-width:0;line-height:1.25}
    .pub small{display:block;font-size:11px;font-weight:300;opacity:.65}
    .pub b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .read{flex-shrink:0;background:var(--ink);color:#fff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:500;text-decoration:none}
    .read:hover{background:#000}
    .sum{font-size:14.5px;line-height:1.55;margin-top:14px;opacity:.85}

    .more{display:grid;gap:6px;margin-top:16px}
    details{background:rgba(0,0,0,.06);border-radius:18px}
    summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 12px 16px;
      font-size:14px;font-weight:500;-webkit-tap-highlight-color:transparent}
    summary::-webkit-details-marker{display:none}
    summary::after{content:'+';width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;font-size:17px;font-weight:400;flex-shrink:0}
    details[open] summary::after{content:'–'}
    .body{padding:0 16px 16px;font-size:14px;line-height:1.55;opacity:.9}
    .body ul{list-style:none}
    .body li{position:relative;padding-left:16px;margin:8px 0}
    .body li::before{content:'';position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:currentColor}

    .acts{display:flex;align-items:center;gap:8px;margin-top:14px}
    .tell{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 15px;border-radius:999px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;margin-right:auto}
    .tell:hover{background:#000}
    .tell svg{width:16px;height:16px}
    .act{width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,.08);display:grid;place-items:center;transition:background .15s}
    .act:hover{background:rgba(0,0,0,.14)}
    .act svg{width:17px;height:17px}
    .act.on{background:var(--ink);color:#fff}
    .act.on svg{fill:currentColor}

    /* CVE cards (dark, yellow accent) */
    .cves{display:grid;gap:10px}
    .cve{background:var(--panel);border-radius:24px;padding:18px}
    .cve .ids{display:flex;flex-wrap:wrap;gap:6px}
    .cve .id{font-family:var(--mono);font-size:11.5px;font-weight:700;background:var(--yellow);color:var(--ink);padding:4px 9px;border-radius:7px}
    .cve .b{background:var(--panel2);color:var(--text)}
    .cve .b.crit{background:var(--red);color:#fff}
    .cve .b.you{background:none;box-shadow:inset 0 0 0 1px var(--yellow);color:var(--yellow)}
    .cve h3{font-size:16.5px;font-weight:500;line-height:1.35;margin-top:11px;overflow-wrap:anywhere}
    .cve h3 a{color:inherit;text-decoration:none}
    .cve h3 a:hover{color:var(--yellow)}
    .cve .sum{font-size:13.5px;font-weight:300;color:var(--muted);opacity:1;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .cve .by{font-size:12px;font-weight:300;color:var(--muted);margin-top:9px}
    .cve details{background:var(--panel2);margin-top:12px;border-radius:16px}
    .cve summary{font-size:13.5px;padding:10px 12px 10px 14px}
    .cve summary::after{background:var(--yellow);color:var(--ink)}
    .cve .body{padding:0 14px 14px;font-size:13.5px;font-weight:300}
    .cve .body li::before{background:var(--yellow)}
    .cve .tell{height:36px;padding:0 13px;font-size:13px;background:var(--panel2);color:var(--text);margin-top:10px}
    .cve .tell:hover{background:var(--line)}

    /* Sources */
    .hint{font-size:14px;font-weight:300;color:var(--muted);margin-bottom:14px}
    .rows{display:grid;gap:8px}
    .row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border-radius:20px;padding:12px 14px;transition:background .15s}
    .row:hover{background:var(--panel2)}
    .row .av{background:var(--c0);color:var(--ink)}
    .row .n{flex:1;min-width:0;font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row .c{font-size:12.5px;background:var(--panel2);border-radius:999px;padding:4px 10px;color:var(--muted)}
    .sub{font-size:13px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
    .tags{display:flex;flex-wrap:wrap;gap:6px}
    .tags a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px}
    .tags a:hover{color:var(--text);border-color:var(--muted)}

    /* "Does this affect me?" */
    .pill{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;height:42px;padding:0 17px;border-radius:999px;background:var(--ink);color:#fff;
      font-size:14px;font-weight:500;white-space:nowrap}
    .pill.y{background:var(--yellow);color:var(--ink)}
    .promo{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:var(--yellow);color:var(--ink);border-radius:24px;padding:16px 12px 16px 20px}
    .promo div{flex:1;min-width:0}
    .promo b{display:block;font-size:16.5px;font-weight:600;line-height:1.25}
    .promo p{font-size:13.5px;line-height:1.4;margin-top:3px}
    .promo .x{flex-shrink:0;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px}
    .promo .x:hover{background:rgba(0,0,0,.1)}
    .hero{background:var(--yellow);color:var(--ink);border-radius:28px;padding:28px 22px 24px}
    .hero h3{font-size:28px;font-weight:600;letter-spacing:-.5px;line-height:1.12}
    .hero p{font-size:15.5px;line-height:1.5;margin:12px 0 20px;max-width:44ch}
    .hero small{display:block;font-size:12.5px;opacity:.72;margin-top:16px}
    .mine{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px}
    .mine span{font-size:13px;background:var(--panel);border-radius:999px;padding:6px 12px}
    .mine button{font-size:13px;font-weight:500;background:var(--yellow);color:var(--ink);border-radius:999px;padding:6px 15px}
    .pbar{position:sticky;top:env(safe-area-inset-top,0);z-index:5;display:flex;align-items:center;gap:8px;background:var(--bg);padding:8px 0 12px}
    .pbar .search{flex:1;min-width:0;margin:0;max-width:none}
    .pick{font-size:14px;line-height:1.3;border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--text);transition:background .15s,border-color .15s}
    .pick:hover{border-color:var(--muted)}
    .pick.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink);font-weight:500}
    .addrow{display:flex;gap:8px;margin-bottom:12px}
    .addrow input{flex:1;min-width:0;height:44px;background:var(--panel);border-radius:999px;padding:0 18px;outline:none;font-size:16px}
    .addrow input:focus{box-shadow:0 0 0 2px var(--yellow)}

    /* Family alert sheet */
    dialog.sheet{border:none;padding:0;background:var(--panel);color:var(--text);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;margin:auto auto 0;
      border-radius:28px 28px 0 0;overflow:auto}
    dialog.sheet:not([open]){display:none}
    dialog.sheet[open]{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30}
    dialog.sheet::backdrop{background:rgba(0,0,0,.62)}
    .sheet-in{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0))}
    .sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
    .sheet-h h2{font-size:23px;font-weight:600;letter-spacing:-.3px}
    .sheet-h .round{width:40px;height:40px;font-size:15px}
    .sheet textarea{display:block;width:100%;min-height:260px;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:14px;
      font-size:16px;line-height:1.5;resize:vertical;margin:12px 0 8px}
    .sheet textarea:focus{outline:none;border-color:var(--yellow)}
    .sheet .hint{margin-bottom:10px}
    .sheet-acts{display:flex;flex-wrap:wrap;gap:8px}
    .cta{flex:1 1 100%;display:flex;align-items:center;justify-content:center;height:50px;border-radius:999px;background:var(--yellow);color:var(--ink);
      font-size:15.5px;font-weight:600;text-decoration:none}
    .ghost{flex:1;height:46px;border-radius:999px;border:1px solid var(--line);font-size:14.5px;font-weight:500}
    .ghost:hover{background:var(--panel2)}
    @media(min-width:640px){dialog.sheet{margin:auto;border-radius:28px}dialog.sheet[open]{top:0}}

    .empty{padding:56px 20px;text-align:center;font-size:15px;font-weight:300;color:var(--muted);background:var(--panel);border-radius:28px}
    .skel{height:200px;border-radius:28px;background:var(--panel);animation:fade 1.4s ease-in-out infinite}
    @keyframes fade{50%{opacity:.5}}

    /* Floating dock */
    .dock{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:10;display:flex;gap:6px;
      padding:7px;border-radius:999px;background:rgba(34,34,37,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 34px rgba(0,0,0,.55)}
    .dk{position:relative;height:48px;min-width:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:7px;padding:0 14px;color:var(--muted);
      font-size:14px;font-weight:500;white-space:nowrap;transition:background .2s,color .2s}
    .dk i{display:none;font-style:normal}
    .dk.on{background:var(--text);color:var(--ink)}
    .dk.on i{display:inline}
    .dk em{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--yellow);color:var(--ink);
      font-size:10.5px;font-weight:700;font-style:normal;line-height:17px;text-align:center}
    .dk em:empty{display:none}
    @media(max-width:370px){.dock{gap:3px;padding:6px}.dk{min-width:44px;height:44px;padding:0 11px}}
    .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0));transform:translateX(-50%);z-index:11;background:var(--yellow);color:var(--ink);
      font-size:13.5px;font-weight:500;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
    .toast.show{opacity:1}

    /* Wide screens: CVE column beside the news */
    .side{display:none}
    @media(min-width:980px){
      .wrap{max-width:1180px;padding:32px 28px 0}
      .grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
      .side{display:block}
      .side .vtitle{font-size:21px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
      .side .vtitle span{font-size:13px;font-weight:500;background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 11px}
      #dk-cves{display:none}
      .cards{grid-template-columns:1fr 1fr;align-items:start}
      .search{max-width:420px}
      .hero{padding:40px 36px 34px}
    }
    :focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
    .card :focus-visible,.promo :focus-visible,.hero :focus-visible{outline-color:var(--ink)}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.800-1.200-8-4.500-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></div>
    <h1>ThreatLens</h1>
    <button class="round" id="refresh" onclick="load(true)" aria-label="Refresh news" title="Refresh">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.640-6.360"/><path d="M21 3v6h-6"/></svg>
    </button>
  </header>

  <div class="grid">
    <div>
      <div id="tools">
        <label class="search">
          <input id="q" type="search" placeholder="Search news" autocomplete="off" oninput="S.q=this.value;renderMain()" aria-label="Search news">
          <span><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg></span>
        </label>
        <div class="cats" id="cats"></div>
      </div>
      <h2 class="vtitle" id="vtitle" hidden></h2>
      <div class="status" id="status"></div>
      <main id="list"></main>
    </div>
    <aside class="side" id="side" aria-label="CVE watch"></aside>
  </div>
</div>

<nav class="dock" aria-label="Sections">
  <button class="dk on" id="dk-news" onclick="go('news')" aria-label="News"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg><i>News</i></button>
  <button class="dk" id="dk-you" onclick="go('you')" aria-label="For you"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3.500 3.500-6 8-6s8 2.500 8 6"/></svg><i>For you</i><em id="youCount"></em></button>
  <button class="dk" id="dk-cves" onclick="go('cves')" aria-label="CVEs"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.500-3.200 7.800-8 9-4.800-1.200-8-4.500-8-9V6z"/><path d="M12 8v5"/><path d="M12 16.500v.010"/></svg><i>CVEs</i></button>
  <button class="dk" id="dk-sources" onclick="go('sources')" aria-label="Sources"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg><i>Sources</i></button>
  <button class="dk" id="dk-saved" onclick="go('saved')" aria-label="Saved"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4.500L6 21z"/></svg><i>Saved</i></button>
</nav>
<div class="toast" id="toast" role="status"></div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-in">
    <div class="sheet-h">
      <h2 id="sheetTitle">Family alert</h2>
      <button class="round" onclick="closeAlert()" aria-label="Close">✕</button>
    </div>
    <p class="hint">A short warning in plain language that you can forward. Pick a language, and edit the text if you like.</p>
    <div class="tags" id="langs" role="group" aria-label="Language"></div>
    <textarea id="alertText" rows="12" aria-label="Alert message" oninput="syncAlert()"></textarea>
    <p class="hint" id="langNote" hidden>The explanation and tips are translated. The headline stays in English.</p>
    <div class="sheet-acts">
      <a class="cta" id="waBtn" target="_blank" rel="noopener">Send on WhatsApp</a>
      <button class="ghost" id="shareBtn" onclick="shareAlert()">Share</button>
      <button class="ghost" onclick="copyAlert(this)">Copy</button>
    </div>
  </div>
</dialog>

<script src="/data.js"></script>
<script>
// ---------- Setup ----------
const D=window.TL_DATA||{groups:[],langs:[['en','English']],labelKeys:{},alerts:{}};
const KEY='tl3_news',SAVE_KEY='tl_saved',STACK_KEY='tl_stack',LANG_KEY='tl_lang',PROMO_KEY='tl_promo_off',TTL=30;
const CATS=[['all','Trending'],['threats','Threats'],['vulnerabilities','Vulnerabilities'],['breaches','Breaches'],['cloud','Cloud'],['ai','AI'],['policy','Policy']];
const VIEWS=['news','you','cves','sources','saved'];
const TITLES={you:'For You',cves:'CVE Watch',sources:'Sources',saved:'Saved News'};
const ICON={
  share:'<svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4.500L6 21z"/></svg>',
  tell:'<svg viewBox="0 0 24 24"><path d="M4 10v4h3l7 4V6l-7 4z"/><path d="M17.500 9a4 4 0 0 1 0 6"/></svg>',
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.500-3.500"/></svg>'
};
const SKEL='<div class="cards"><div class="skel"></div><div class="skel"></div></div>';
const S={view:'news',items:[],feeds:[],saved:[],cat:'all',src:null,q:'',loading:false,at:null,err:null,
  stack:{ids:[],custom:[]},picking:false,pq:'',promoOff:false,alert:null,lang:'en'};
let R=[];                        // stories on screen, so buttons can refer to them by number
let rules=[],ruleVer=0;          // compiled keyword rules for what the user uses
let toastTimer;
const hitCache=new WeakMap();
const CATALOG=new Map();
for(const g of D.groups)for(const it of g.items)CATALOG.set(it.id,it);
const $=id=>document.getElementById(id);
const wide=matchMedia('(min-width:980px)');
const news=()=>S.items.filter(i=>!i.is_cve);
const cves=()=>S.items.filter(i=>i.is_cve);
const stackSize=()=>S.stack.ids.length+S.stack.custom.length;

// ---------- Small helpers ----------
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function link(u){return /^https?:\/\//i.test(u||'')?esc(u):''}
function ago(d){
  const t=new Date(d).getTime();if(!t)return'';
  const m=Math.max(0,Math.round((Date.now()-t)/60000));
  if(m<60)return m<1?'just now':m+'m ago';
  const h=Math.round(m/60);return h<24?h+'h ago':Math.round(h/24)+'d ago';
}
function initial(s){const m=String(s||'').match(/[A-Za-z0-9]/);return m?m[0].toUpperCase():'•'}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
function store(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v))}catch(e){}}
// [source name, story count], most stories first
function counts(){
  const m=new Map();
  for(const i of S.items)if(i.source)m.set(i.source,(m.get(i.source)||0)+1);
  return [...m].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]));
}

// ---------- Loading news ----------
function go(v){S.view=v;S.picking=false;render();scrollTo(0,0)}
function setCat(c){S.cat=c;render()}
function setSrc(i){S.src=i==null?null:counts()[i][0];S.cat='all';S.q='';$('q').value='';S.view='news';render();scrollTo(0,0)}

async function load(force){
  if(S.loading)return;
  S.loading=true;S.err=null;render();
  try{
    const r=await fetch('/api/news'+(force?'?r='+Date.now():''));
    const d=await r.json().catch(()=>null);
    if(!r.ok)throw new Error((d&&d.error)||'Server error '+r.status);
    if(!d||!d.items||!d.items.length)throw new Error('Nothing came back from the feeds.');
    S.items=d.items;S.feeds=d.feeds||[];S.at=Date.now();
    if(S.src&&!S.items.some(i=>i.source===S.src))S.src=null;
    store(KEY,{items:S.items,feeds:S.feeds,ts:S.at});
    if(force)toast('Updated');
  }catch(e){S.err=e.message||'Could not load.'}
  finally{S.loading=false;render()}
}

// ---------- Saved stories and sharing ----------
function isSaved(n){return S.saved.some(s=>s.url===n.url&&s.title===n.title)}
function toggleSave(i){
  const n=R[i];if(!n)return;
  if(isSaved(n)){S.saved=S.saved.filter(s=>!(s.url===n.url&&s.title===n.title));toast('Removed from saved')}
  else{S.saved=[n,...S.saved].slice(0,100);toast('Saved')}
  store(SAVE_KEY,S.saved);
  if(S.view==='saved'){renderMain();return}
  // Update the button in place so the page doesn't jump
  const on=isSaved(n),b=document.querySelector(`[data-save="${i}"]`);
  if(b){b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'Remove from saved':'Save story')}
}
async function share(i){
  const n=R[i];if(!n||!/^https?:\/\//i.test(n.url||''))return;
  try{
    if(navigator.share)await navigator.share({title:n.title,url:n.url});
    else{await navigator.clipboard.writeText(n.url);toast('Link copied')}
  }catch(e){}
}

// ---------- "Does this affect me?" ----------
// The user's list never leaves the device: matching happens here in the browser.
const WB='(?:^|[^A-Za-z0-9])',WE='(?![A-Za-z0-9])'; // whole-word boundaries
function mkRe(list,flags){
  if(!list||!list.length)return null;
  try{return new RegExp(WB+'(?:'+list.join('|')+')'+WE,flags)}catch(e){return null}
}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function buildRules(){
  rules=[];
  for(const id of S.stack.ids){
    const it=CATALOG.get(id);
    if(it)rules.push({label:it.short||it.label,i:mkRe(it.kw,'i'),c:mkRe(it.cs,'')});
  }
  for(const w of S.stack.custom)rules.push({label:w,i:mkRe([escRe(w).replace(/\s+/g,'\\s+')],'i'),c:null});
  ruleVer++;
}
// Names of the user's things that a story mentions
function hits(n){
  if(!rules.length)return [];
  const c=hitCache.get(n);if(c&&c.v===ruleVer)return c.h;
  const text=n.title+' '+(n.summary||''),h=[];
  for(const r of rules)if(((r.i&&r.i.test(text))||(r.c&&r.c.test(text)))&&!h.includes(r.label))h.push(r.label);
  hitCache.set(n,{v:ruleVer,h});
  return h;
}
function youBadge(n){
  const h=hits(n);if(!h.length)return'';
  return `<span class="b you">May affect you · ${esc(h.slice(0,2).join(', ')+(h.length>2?' +'+(h.length-2):''))}</span>`;
}
function saveStack(){store(STACK_KEY,S.stack);buildRules()}
function updateDockBadge(){$('youCount').textContent=(rules.length?S.items.filter(n=>hits(n).length).length:0)||''}

function startPicking(){S.picking=true;S.pq='';S.view='you';render();scrollTo(0,0)}
function donePicking(){S.picking=false;render();scrollTo(0,0)}
function dismissPromo(){S.promoOff=true;store(PROMO_KEY,'1');renderMain()}
function togglePick(id,btn){
  const k=S.stack.ids.indexOf(id);
  if(k>=0)S.stack.ids.splice(k,1);else S.stack.ids.push(id);
  saveStack();
  btn.classList.toggle('on',k<0);btn.setAttribute('aria-pressed',k<0);
  syncPickCount();
}
function addCustom(ev){
  ev.preventDefault();
  const inp=$('cq'),w=inp.value.trim().replace(/\s+/g,' ').slice(0,40);
  if(w.length<3){toast('Type at least 3 letters');return}
  if(S.stack.custom.some(c=>c.toLowerCase()===w.toLowerCase())){toast('Already added');inp.value='';return}
  if(S.stack.custom.length>=30){toast('You can add up to 30');return}
  S.stack.custom.push(w);saveStack();inp.value='';renderCustoms();syncPickCount();
}
function removeCustom(i){S.stack.custom.splice(i,1);saveStack();renderCustoms();syncPickCount()}
function renderCustoms(){
  $('customs').innerHTML=S.stack.custom.map((w,i)=>`<button class="pick on" onclick="removeCustom(${i})" aria-label="Remove ${esc(w)}">${esc(w)} ✕</button>`).join('');
}
function syncPickCount(){const n=stackSize(),b=$('pdone');if(b)b.textContent=n?'Done · '+n:'Done';updateDockBadge()}
function filterPicks(q){S.pq=q;$('pgroups').innerHTML=pickGroups()}
function pickGroups(){
  const q=S.pq.trim().toLowerCase();
  const html=D.groups.map(g=>{
    const its=g.items.filter(it=>!q||(it.label+' '+g.name+' '+(it.kw||[]).join(' ')).toLowerCase().includes(q));
    if(!its.length)return'';
    return `<h3 class="sub">${esc(g.name)}</h3><div class="tags">${its.map(it=>{
      const on=S.stack.ids.includes(it.id);
      return `<button class="pick ${on?'on':''}" aria-pressed="${on}" onclick="togglePick('${it.id}',this)">${esc(it.label)}</button>`;
    }).join('')}</div>`;
  }).join('');
  return html||'<p class="hint" style="margin-top:18px">Nothing in the list matches. You can add it yourself below.</p>';
}
function renderPicker(){
  $('list').innerHTML=`<div class="pbar">
      <label class="search"><input id="pq" type="search" placeholder="Search apps, devices, banks" autocomplete="off" oninput="filterPicks(this.value)" aria-label="Search the list"><span>${ICON.search}</span></label>
      <button class="pill y" id="pdone" onclick="donePicking()">Done</button>
    </div>
    <p class="hint">Tap everything you use. ThreatLens will flag the stories that mention it. Your choices are stored on this device only.</p>
    <div id="pgroups">${pickGroups()}</div>
    <h3 class="sub">Add your own</h3>
    <p class="hint">Your bank, school, employer, a gadget brand, or anything else that isn't in the list.</p>
    <form class="addrow" onsubmit="addCustom(event)"><input id="cq" maxlength="40" placeholder="e.g. Fidelity, Canvas, Fitbit" autocomplete="off" aria-label="Add your own"><button class="pill y">Add</button></form>
    <div class="tags" id="customs"></div>`;
  renderCustoms();syncPickCount();
}
function renderYou(){
  if(S.picking){if(!$('pgroups'))renderPicker();return} // don't redraw the picker under the user's fingers
  if(!stackSize()){
    $('list').innerHTML=`<div class="hero">
      <h3>Does this affect me?</h3>
      <p>Tell ThreatLens which phones, apps and services you use. Every story that mentions one of them gets flagged, and they all collect here.</p>
      <button class="pill" onclick="startPicking()">Choose what I use</button>
      <small>Your choices stay on this device. Nothing is sent anywhere.</small>
    </div>`;
    return;
  }
  const names=[...S.stack.ids.map(id=>CATALOG.get(id)).filter(Boolean).map(it=>it.short||it.label),...S.stack.custom];
  const mine=`<div class="mine">${names.slice(0,6).map(x=>`<span>${esc(x)}</span>`).join('')}${names.length>6?`<span>+${names.length-6}</span>`:''}<button onclick="startPicking()">Edit</button></div>`;
  if(!S.items.length){
    $('list').innerHTML=mine+(S.loading?SKEL:`<div class="empty">${S.err?'Couldn’t load right now. Tap refresh to try again.':'Nothing here yet.'}</div>`);
    return;
  }
  const m=S.items.filter(n=>hits(n).length);
  $('list').innerHTML=mine+(m.length
    ?`<p class="hint">Stories are matched by name, so open one to check it applies to your model or version.</p><div class="cards">${m.map(story).join('')}</div>`
    :'<div class="empty">Nothing in the current feed mentions what you use. Check back after the next refresh, or add more of what you use.</div>');
}

// ---------- Family alert ----------
function typeKey(n){return n.threat_type||D.labelKeys[n.threat_label]||'general'}
function alertText(n,lang){
  const A=D.alerts[lang]||D.alerts.en,t=A.types[typeKey(n)]||A.types.general,u=A.ui;
  const lines=[
    u.alertTitle+': '+t.name,
    u.intro,
    '',
    u.inTheNews+': "'+n.title+'"'+(n.source?' ('+n.source+')':''),
    '',
    u.whatItMeans+': '+t.means,
    '',
    u.staySafe+':',
    ...t.tips.map((x,i)=>(i+1)+'. '+x)
  ];
  if(/^https?:\/\//i.test(n.url||''))lines.push('',u.readMore+': '+n.url);
  lines.push('','Sent with ThreatLens');
  return lines.join('\n');
}
// WhatsApp shows *text* in bold, so bold the headings for that button only
function waText(text,lang){
  const u=(D.alerts[lang]||D.alerts.en).ui,heads=[u.inTheNews+':',u.whatItMeans+':',u.staySafe+':'];
  return text.split('\n').map((l,i)=>{
    if(i===0&&l.trim())return '*'+l.trim()+'*';
    const h=heads.find(x=>l.startsWith(x));
    return h?'*'+h+'*'+l.slice(h.length):l;
  }).join('\n');
}
function openAlert(i){
  const n=R[i];if(!n)return;
  if(!D.alerts.en){toast('Couldn’t load the alert text. Reload and try again.');return}
  S.alert=n;
  $('langs').innerHTML=D.langs.map(([c,name])=>`<button class="pick ${c===S.lang?'on':''}" aria-pressed="${c===S.lang}" lang="${c}" onclick="setLang('${c}')">${esc(name)}</button>`).join('');
  fillAlert();
  const d=$('sheet');
  if(d.showModal)d.showModal();else d.setAttribute('open','');
  $('alertText').scrollTop=0;
}
function fillAlert(){
  const a=$('alertText');
  a.value=alertText(S.alert,S.lang);a.lang=S.lang;
  $('langNote').hidden=S.lang==='en';
  syncAlert();
}
function setLang(c){
  S.lang=c;store(LANG_KEY,c);
  for(const b of $('langs').children){const on=b.getAttribute('lang')===c;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)}
  fillAlert();
}
function syncAlert(){$('waBtn').href='https://wa.me/?text='+encodeURIComponent(waText($('alertText').value,S.lang))}
function flash(btn,msg){const o=btn.textContent;btn.textContent=msg;setTimeout(()=>{btn.textContent=o},1400)}
async function copyAlert(btn){
  const a=$('alertText');
  try{await navigator.clipboard.writeText(a.value)}
  catch(e){a.select();try{document.execCommand('copy')}catch(e2){}}
  flash(btn,'Copied');
}
async function shareAlert(){try{await navigator.share({text:$('alertText').value})}catch(e){}}
function closeAlert(){const d=$('sheet');if(d.close)d.close();else d.removeAttribute('open')}

// ---------- Rendering ----------
function render(){
  if(wide.matches&&S.view==='cves')S.view='news'; // CVEs already sit in the side column
  for(const v of VIEWS)$('dk-'+v).classList.toggle('on',S.view===v);
  const btn=$('refresh');btn.disabled=S.loading;btn.classList.toggle('spin',S.loading);
  R=[];
  const cv=cves();
  $('side').innerHTML=S.items.length?`<h2 class="vtitle">CVE Watch<span>${cv.length}</span></h2>${cveList(cv)}`:'';
  updateDockBadge();
  renderMain();
}

function renderMain(){
  const v=S.view,cs=counts(),cv=cves(),picking=v==='you'&&S.picking;
  $('tools').hidden=v!=='news';
  $('vtitle').hidden=v==='news';
  $('vtitle').textContent=picking?'What do you use?':TITLES[v]||'';

  let st='';
  if(!picking){
    if(S.loading&&!S.items.length)st='Loading the latest stories…';
    else if(v==='you'){
      if(stackSize()&&S.items.length)st=S.items.filter(n=>hits(n).length).length+' of '+S.items.length+' stories mention something you use';
    }
    else if(S.items.length)st=news().length+' stories · '+cv.length+' CVEs · '+cs.length+' sources · updated '+new Date(S.at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
    if(S.err)st=(st?st+' · ':'')+'<span class="err">'+esc(S.err)+'</span>';
  }
  $('status').innerHTML=st;
  $('status').hidden=picking;

  if(v==='you'){renderYou();return}
  if(v==='saved'){
    $('list').innerHTML=S.saved.length?`<div class="cards">${S.saved.map(story).join('')}</div>`
      :'<div class="empty">Nothing saved yet. Tap the bookmark on a story to keep it here.</div>';
    return;
  }
  if(!S.items.length){
    $('cats').innerHTML='';
    $('list').innerHTML=S.loading?SKEL:`<div class="empty">${S.err?'Couldn’t load right now. Tap refresh to try again.':'Nothing here yet.'}</div>`;
    return;
  }
  if(v==='cves')$('list').innerHTML=cveList(cv);
  else if(v==='sources')renderSources(cs);
  else renderNews();
}

function renderNews(){
  const pool=S.src?S.items.filter(i=>i.source===S.src):news();
  const srcPill=S.src?`<button class="srcpill" onclick="setSrc(null)" aria-label="Clear source filter">${esc(S.src)} ✕</button>`:'';
  $('cats').innerHTML=srcPill+CATS.filter(([id])=>id==='all'||pool.some(i=>i.category===id))
    .map(([id,name])=>`<button class="cat ${S.cat===id?'on':''}" onclick="setCat('${id}')">${name}</button>`).join('');
  let rows=S.cat==='all'?pool:pool.filter(i=>i.category===S.cat);
  const q=S.q.trim().toLowerCase();
  if(q)rows=rows.filter(i=>(i.title+' '+(i.summary||'')+' '+(i.source||'')).toLowerCase().includes(q));
  // Invite people to set up "Does this affect me?" until they do, or dismiss it
  const promo=!stackSize()&&!S.promoOff&&!q?`<div class="promo">
      <div><b>Does this affect me?</b><p>Tell ThreatLens what you use and it will flag the stories that matter to you.</p></div>
      <button class="pill" onclick="startPicking()">Set up</button>
      <button class="x" onclick="dismissPromo()" aria-label="Dismiss">✕</button>
    </div>`:'';
  $('list').innerHTML=rows.length?`<div class="cards">${promo}${rows.map(story).join('')}</div>`
    :`<div class="cards">${promo}</div><div class="empty"${promo?' style="margin-top:14px"':''}>No stories match.</div>`;
}

function story(n,k){
  const i=R.push(n)-1,u=link(n.url),pri=n.priority;
  const badges=youBadge(n)+(pri==='critical'?'<span class="b crit">Critical</span>':pri==='high'?'<span class="b high">High</span>':'')+(n.threat_label?`<span class="b">${esc(n.threat_label)}</span>`:'');
  const when=n.pubDate?ago(n.pubDate):'';
  const explain=n.explanation?`<details><summary>What this means</summary><div class="body">${esc(n.explanation)}</div></details>`:'';
  const protect=n.prevention&&n.prevention.length?`<details><summary>How to protect yourself</summary><div class="body"><ul>${n.prevention.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div></details>`:'';
  const saved=isSaved(n);
  return `<article class="card c${k%5}" style="animation-delay:${Math.min(k,8)*40}ms">
    <div class="badges">${badges}</div>
    <h2>${esc(n.title)}</h2>
    ${when?`<div class="upd">Updated ${when}</div>`:''}
    <div class="pub"><span class="av">${initial(n.source)}</span><div><small>Published by</small><b>${esc(n.source||'Unknown source')}</b></div>${u?`<a class="read" href="${u}" target="_blank" rel="noopener">Read ↗</a>`:''}</div>
    ${n.summary?`<p class="sum">${esc(n.summary)}</p>`:''}
    <div class="more">${explain}${protect}</div>
    <div class="acts"><button class="tell" onclick="openAlert(${i})">${ICON.tell}Tell family</button>${u?`<button class="act" onclick="share(${i})" aria-label="Share story">${ICON.share}</button>`:''}<button class="act ${saved?'on':''}" data-save="${i}" onclick="toggleSave(${i})" aria-label="${saved?'Remove from saved':'Save story'}" aria-pressed="${saved}">${ICON.save}</button></div>
  </article>`;
}

function cveList(cv){return cv.length?`<div class="cves">${cv.map(cveItem).join('')}</div>`:'<div class="empty">No new CVEs right now.</div>'}

function cveItem(n){
  const i=R.push(n)-1,u=link(n.url),id=n.cve_id||'';
  // Feed titles often start with the CVE number, which is already shown above the headline
  const rest=id?n.title.replace(new RegExp('^\\s*'+id+'\\s*[-:–—|]*\\s*','i'),''):n.title;
  const title=rest||n.summary||n.title;
  const sum=rest&&n.summary&&n.summary!==title?`<p class="sum">${esc(n.summary)}</p>`:'';
  const when=n.pubDate?ago(n.pubDate):'';
  const tips=n.prevention&&n.prevention.length?`<ul style="margin-top:8px">${n.prevention.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:'';
  const help=n.explanation?`<details><summary>Explain and protect</summary><div class="body">${esc(n.explanation)}${tips}</div></details>`:'';
  return `<article class="cve">
    <div class="ids">${id?`<span class="id">${esc(id)}</span>`:''}${n.priority==='critical'?'<span class="b crit">Critical</span>':''}${youBadge(n)}</div>
    <h3>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(title)}</a>`:esc(title)}</h3>
    ${sum}
    <div class="by">${esc(n.source||'Unknown source')}${when?' · '+when:''}</div>
    ${help}
    <button class="tell" onclick="openAlert(${i})">${ICON.tell}Tell family</button>
  </article>`;
}

function renderSources(cs){
  const active=new Set(cs.map(c=>c[0]));
  const quiet=S.feeds.filter(f=>!active.has(f.name)&&f.name!=='Google News');
  const rows=cs.map(([name,c],i)=>`<button class="row" onclick="setSrc(${i})"><span class="av" style="background:var(--c${i%5})">${initial(name)}</span><span class="n">${esc(name)}</span><span class="c">${c} ${c===1?'story':'stories'}</span></button>`).join('');
  const quietHtml=quiet.length?`<div class="sub">Also monitored</div>
    <p class="hint">Checked on every refresh, but none of their stories are in the feed right now.</p>
    <div class="tags">${quiet.map(f=>`<a href="${link(f.site)||'#'}" target="_blank" rel="noopener">${esc(f.name)}</a>`).join('')}</div>`:'';
  $('list').innerHTML=`<p class="hint">Tap a source to see only its stories. Mainstream outlets are found through Google News.</p><div class="rows">${rows}</div>${quietHtml}`;
}

// ---------- Start ----------
// Show the saved copy instantly, then fetch fresh if it is older than 30 minutes
try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.items&&d.items.length){S.items=d.items;S.feeds=d.feeds||[];S.at=d.ts}}catch(e){}
try{const d=JSON.parse(localStorage.getItem(SAVE_KEY));if(Array.isArray(d))S.saved=d}catch(e){}
try{
  const d=JSON.parse(localStorage.getItem(STACK_KEY));
  if(d&&Array.isArray(d.ids)&&Array.isArray(d.custom))S.stack={
    ids:d.ids.filter(x=>typeof x==='string'&&(!CATALOG.size||CATALOG.has(x))),
    custom:d.custom.filter(x=>typeof x==='string'&&x.trim().length>=3).slice(0,30)
  };
}catch(e){}
try{S.promoOff=localStorage.getItem(PROMO_KEY)==='1';const l=localStorage.getItem(LANG_KEY);if(l&&D.alerts[l])S.lang=l}catch(e){}
buildRules();
if(!navigator.share)$('shareBtn').hidden=true;
$('sheet').addEventListener('click',e=>{if(e.target===e.currentTarget)closeAlert()}); // tap outside to close
wide.addEventListener('change',render);
render();
if(!S.at||Date.now()-S.at>TTL*60000)load(false);

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script>
</body>
</html>
